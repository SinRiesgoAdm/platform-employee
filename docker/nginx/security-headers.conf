# =====================================================================
#  Encabezados de seguridad
#  OJO: en nginx, un add_header dentro de una location ANULA todos los
#  add_header heredados del server. Por eso este archivo se incluye en
#  cada location en lugar de declararse una sola vez arriba.
# =====================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

# CSP en modo "solo reporte": no bloquea nada, solo avisa en la consola.
# Pruébala en producción, revisa la consola y, cuando no haya
# violaciones, cambia el nombre a "Content-Security-Policy".
# - frame-src: los videos de capacitaciones usan embeds de YouTube.
# - connect-src 'self': el API va por el mismo origen gracias al proxy.
#   Los dominios de googleapis son los que usa Firebase Messaging para
#   obtener y renovar el token de push.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://fcmregistrations.googleapis.com https://firebaseinstallations.googleapis.com https://fcm.googleapis.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
